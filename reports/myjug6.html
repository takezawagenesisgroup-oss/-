const corps=[...new Set(stores.map(s=>s.c))].map(c=>{const ss=stores.filter(s=>s.c===c);const d=ss.filter(s=>s.jug!=null);

let sk='r6',sd=-1;
function draw(){const f=sel.value,q=document.getElementById('q').value.trim();
let list=stores.filter(s=>(!f||s.c===f)&&(!q||s.n.includes(q)));
list.sort((a,b)=>{const x=a[sk],y=b[sk];if(x==null)return 1;if(y==null)return -1;return(typeof x==='string'?x.localeCompare(y,'ja'):x-y)*sd});
document.getElementById('cnt').textContent=list.length+'店';
document.getElementById('store').innerHTML='<thead><tr><th>#</th>'+cols.map(([k,l,t])=>`<th class="sort${t?' name':''}" tabindex="0" data-k="${k}">${l}${k===sk?(sd<0?' ▼':' ▲'):''}</th>`).join('')+'</tr></thead><tbody>'+
list.map((s,i)=>`<tr class="${s.c==='ジェネシス'?'gen':''}"><td>${i+1}</td><td class="name">${s.c}</td><td class="name">${s.n}</td><td>${fn(s.v5)}</td><td>${fn(s.v6)}</td><td>${fn(s.now)}</td><td>${fn(s.jug)}</td><td>${fp(s.r5)}</td><td>${fp(s.r6)}</td></tr>`).join('')+'</tbody>';
document.querySelectorAll('#store th.sort').forEach(th=>{const go=()=>{const k=th.dataset.k;if(k===sk)sd=-sd;else{sk=k;sd=(k==='c'||k==='n')?1:-1}draw()};th.onclick=go;th.onkeydown=e=>{if(e.key==='Enter')go()}})}
sel.onchange=draw;document.getElementById('q').oninput=draw;draw();
</script>
