<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  svg { display: block; }
</style>
</head>
<body>
<svg id="art" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="72%" cy="26%" r="75%">
      <stop offset="0%" stop-color="#22332C"/>
      <stop offset="55%" stop-color="#152420"/>
      <stop offset="100%" stop-color="#0F1614"/>
    </radialGradient>
    <linearGradient id="waveTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4C9C81"/>
      <stop offset="100%" stop-color="#7CCBAA"/>
    </linearGradient>
    <linearGradient id="waveMid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B7C67"/>
      <stop offset="100%" stop-color="#5FB795"/>
    </linearGradient>
    <radialGradient id="moonGrad" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#F3DBA0"/>
      <stop offset="100%" stop-color="#D9A94F"/>
    </radialGradient>
  </defs>

  <rect id="bgRect" x="0" y="0" width="1024" height="1024" fill="url(#bgGlow)"/>

  <g id="mark">
    <circle id="moon" cx="676" cy="300" r="112" fill="url(#moonGrad)"/>

    <path id="waveBack" d="M 128 646
      C 260 588, 392 588, 512 646
      C 632 704, 764 704, 896 646"
      fill="none" stroke="url(#waveMid)" stroke-width="46" stroke-linecap="round" opacity="0.55"/>

    <path id="waveFront" d="M 96 760
      C 244 690, 396 690, 512 760
      C 628 830, 780 830, 928 760"
      fill="none" stroke="url(#waveTop)" stroke-width="54" stroke-linecap="round"/>
  </g>
</svg>
</body>
</html>
