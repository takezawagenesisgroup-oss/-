<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  svg { display: block; }
</style>
</head>
<body>
<svg id="art" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="46%" cy="52%" r="75%">
      <stop offset="0%" stop-color="#332638"/>
      <stop offset="55%" stop-color="#221A28"/>
      <stop offset="100%" stop-color="#1B1620"/>

    <radialGradient id="orbGrad" cx="35%" cy="30%" r="70%">

      <stop offset="100%" stop-color="#B87B3C"/>

      <stop offset="0%" stop-color="#E3A9BB"/>
      <stop offset="100%" stop-color="#C98BA0"/>

      <stop offset="0%" stop-color="#F0C6D3"/>
      <stop offset="100%" stop-color="#C98BA0"/>
    </radialGradient>

  <rect id="bgRect" x="0" y="0" width="1024" height="1024" fill="url(#bgGlow)"/>

  <g id="mark">
    <path id="embrace"
      d="M 303.8 707.9 A 230 230 0 1 1 696.2 481.3"
      fill="none" stroke="url(#embraceGrad)" stroke-width="58" stroke-linecap="round" opacity="0.9"/>
    <circle id="orb" cx="480" cy="560" r="132" fill="url(#orbGrad)"/>
    <circle id="dot" cx="655" cy="392" r="34" fill="url(#dotGrad)"/>
