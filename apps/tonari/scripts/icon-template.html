<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  svg { display: block; }
</style>
</head>
<body>
<svg id="art" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="30%" cy="70%" r="80%">
      <stop offset="0%" stop-color="#2A1D16"/>
      <stop offset="55%" stop-color="#1B2029"/>
      <stop offset="100%" stop-color="#161A22"/>
    </radialGradient>
    <linearGradient id="pathGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#B8501F"/>
      <stop offset="100%" stop-color="#F0996A"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7FC3E8"/>
      <stop offset="100%" stop-color="#3E8FBF"/>
    </linearGradient>
    <radialGradient id="dotGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#F7C7A6"/>
      <stop offset="100%" stop-color="#E2662F"/>
    </radialGradient>
  </defs>

  <rect id="bgRect" x="0" y="0" width="1024" height="1024" fill="url(#bgGlow)"/>

  <g id="mark">
    <path id="trail"
      d="M 148 800 C 300 760, 380 640, 520 660 C 660 680, 700 560, 860 480"
      fill="none" stroke="url(#pathGrad)" stroke-width="46" stroke-linecap="round"/>

    <path id="wave1" d="M 887.5 432.4 A 55 55 0 0 1 887.5 527.6" fill="none" stroke="url(#waveGrad)" stroke-width="24" stroke-linecap="round" opacity="0.95"/>
    <path id="wave2" d="M 905 402.1 A 90 90 0 0 1 905 557.9" fill="none" stroke="url(#waveGrad)" stroke-width="24" stroke-linecap="round" opacity="0.68"/>
    <path id="wave3" d="M 922.5 371.75 A 125 125 0 0 1 922.5 588.25" fill="none" stroke="url(#waveGrad)" stroke-width="24" stroke-linecap="round" opacity="0.4"/>

    <circle id="dot" cx="860" cy="480" r="34" fill="url(#dotGrad)"/>
  </g>
</svg>
</body>
</html>
