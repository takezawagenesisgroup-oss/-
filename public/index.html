<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>株価チェッカー</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="container">
  <header>
    <h1>株価チェッカー</h1>
    <p class="subtitle">銘柄コードを入力して最新の株価を確認できます</p>
  </header>

  <form id="search-form" class="search-form">
    <input
      type="text"
      id="symbol-input"
      placeholder="例: AAPL, 7203.T (トヨタ), 9984.T (ソフトバンクG)"
      autocomplete="off"
    />
    <button type="submit">検索</button>
  </form>
  <p class="hint">日本株は銘柄コードの末尾に <code>.T</code> を付けてください（例: 7203.T）</p>

  <div id="status" class="status" hidden></div>

  <div id="result" class="result" hidden>
    <div class="quote-card">
      <div class="quote-header">
        <h2 id="quote-symbol"></h2>
        <span id="quote-exchange" class="exchange"></span>
      </div>
      <div class="quote-price">
        <span id="quote-price" class="price"></span>
        <span id="quote-currency" class="currency"></span>
      </div>
      <div id="quote-change" class="change"></div>
      <div class="quote-meta">
        <span>前日終値: <span id="quote-previous-close"></span></span>
        <span>更新時刻: <span id="quote-time"></span></span>
      </div>
    </div>

    <div class="chart-card">
      <div class="chart-header">
        <h3>過去の値動き</h3>
        <div class="range-buttons" id="range-buttons">
          <button type="button" data-range="5d">5日</button>
          <button type="button" data-range="1mo" class="active">1ヶ月</button>
          <button type="button" data-range="6mo">6ヶ月</button>
          <button type="button" data-range="1y">1年</button>
        </div>
      </div>
      <canvas id="chart" width="600" height="240"></canvas>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
