<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1148" font-family="'IPAGothic','Noto Sans JP',sans-serif">
  <style>
    .lbl { font-size: 15px; fill: #1a202c; }
    .lbl-small { font-size: 12px; fill: #4a5568; }
    .lbl-red { font-size: 14px; fill: #c53030; font-weight: bold; }
    .lbl-purple { font-size: 14px; fill: #6b4fa0; font-weight: bold; }
  </style>
  <rect x="0" y="0" width="1040" height="1148" fill="#fafaf7"/>
  <text x="520.0" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a202c">
    木野温泉・病院候補の500m/600m円と対象地(木野大通東13丁目)の位置関係(概算)
  </text>

  <!-- 600m円(参考): 健康ハウス木野温泉 -->
  <circle cx="580.5" cy="783.5" r="270.0"
          fill="none" stroke="#c53030" stroke-width="1.3" stroke-dasharray="2,6" stroke-opacity="0.6"/>

  <!-- 500m規制円: 健康ハウス木野温泉 -->
  <circle cx="580.5" cy="783.5" r="225.0"
          fill="#e53e3e" fill-opacity="0.10" stroke="#c53030" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="704.2" y="659.8" class="lbl-red">
    500m規制円(推定)
  </text>
  <text x="486.0" y="1013.0" class="lbl-red">
    600m円(参考)
  </text>

  <!-- 600m円(参考): 帯広徳洲会病院 -->
  <circle cx="365.5" cy="363.6" r="270.0"
          fill="none" stroke="#6b4fa0" stroke-width="1.3" stroke-dasharray="2,6" stroke-opacity="0.6"/>

  <!-- 500m円(候補・未確認): 帯広徳洲会病院 -->
  <circle cx="365.5" cy="363.6" r="225.0"
          fill="#6b4fa0" fill-opacity="0.08" stroke="#6b4fa0" stroke-width="2" stroke-dasharray="3,5"/>
  <text x="109.0" y="239.8" class="lbl-purple">
    500m円(未確認・候補)
  </text>
  <text x="109.0" y="259.8" class="lbl-purple">
    (外側の淡い点線=600m円)
  </text>

  <!-- 対象地 概形矩形(面積等価) -->
  <rect x="615.7" y="392.4"
        width="19.2" height="138.6"
        fill="#2b6cb0" fill-opacity="0.25" stroke="#2b6cb0" stroke-width="2"/>

  <!-- 木野温泉の600m円に入る南端側の区間 -->
  <rect x="615.7" y="515.7" width="19.2" height="15.3" fill="#c98a1f" fill-opacity="0.5" stroke="#c98a1f" stroke-width="1.5"/>
  <text x="605.7" y="526.4" text-anchor="end" font-size="13" font-weight="bold" fill="#9a6b1f">南端から約34m区間(600m円内)</text>

  <!-- 病院候補への最接近点 -->
  <circle cx="634.1" cy="406.5" r="6" fill="none" stroke="#6b4fa0" stroke-width="2"/>
  <text x="622.1" y="398.5" text-anchor="end" font-size="13" font-weight="bold" fill="#6b4fa0">最接近点 約604.5m(病院候補)</text>

  <!-- 木野温泉→各点の補助線 -->
  <line x1="580.5" y1="783.5" x2="614.2" y2="531.0" stroke="#718096" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="580.5" y1="783.5" x2="615.5" y2="462.8" stroke="#718096" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="580.5" y1="783.5" x2="636.4" y2="392.4" stroke="#718096" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- 病院候補→各点の補助線 -->
  <line x1="365.5" y1="363.6" x2="614.2" y2="531.0" stroke="#6b4fa0" stroke-width="1" stroke-dasharray="2,3" stroke-opacity="0.6"/>
  <line x1="365.5" y1="363.6" x2="615.5" y2="462.8" stroke="#6b4fa0" stroke-width="1" stroke-dasharray="2,3" stroke-opacity="0.6"/>
  <line x1="365.5" y1="363.6" x2="636.4" y2="392.4" stroke="#6b4fa0" stroke-width="1" stroke-dasharray="2,3" stroke-opacity="0.6"/>

  <!-- 木野温泉 -->
  <circle cx="580.5" cy="783.5" r="7" fill="#c53030"/>
  <text x="592.5" y="788.5" class="lbl-red">健康ハウス木野温泉(10丁目)</text>

  <!-- 帯広徳洲会病院(未確認) -->
  <circle cx="365.5" cy="363.6" r="7" fill="#6b4fa0"/>
  <text x="377.5" y="368.6" class="lbl-purple">帯広徳洲会病院(14丁目・未確認)</text>

  <!-- 南端 -->
  <rect x="608.2" y="525.0" width="12" height="12" fill="#1a365d"/>
  <text x="626.2" y="527.0" class="lbl">南端(推定) 木野温泉565m／病院候補665m</text>

  <!-- 中心 -->
  <rect x="609.5" y="456.8" width="12" height="12" fill="#2f855a"/>
  <text x="627.5" y="466.8" class="lbl">中心点 木野温泉716m／病院候補597m</text>

  <!-- 北端 -->
  <rect x="630.4" y="386.4" width="12" height="12" fill="#553c9a"/>
  <text x="648.4" y="396.4" class="lbl">北端(推定) 木野温泉877m／病院候補605m</text>

  <text x="20" y="1072" class="lbl-small">凡例: 赤破線円=健康ハウス木野温泉から半径500m(北海道温泉保護対策要綱の推定離隔距離)</text>
  <text x="20" y="1090" class="lbl-small">     紫点線円=帯広徳洲会病院を中心と仮定した半径500m(温泉法上の源泉の有無は未確認)</text>
  <text x="20" y="1108" class="lbl-small">     外側の淡い点線=600m円(北海道内の運用で目安になり得るとの情報を踏まえた参考円)</text>
  <text x="20" y="1126" class="lbl-small">     青矩形=対象地の概形／橙色部分=木野温泉の600m円に入る区間(面積等価、実際の筆界形状ではない)</text>
</svg>
